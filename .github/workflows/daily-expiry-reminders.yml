name: Daily Expiry Reminders

on:
  schedule:
    # GitHub Actions cron uses UTC. 05:00 UTC is 08:00 in Turkiye.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  trigger-expiry-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger contract expiry reminders
        run: |
          response_file="$(mktemp)"
          http_code="$(
            curl -sS -o "$response_file" -w "%{http_code}" -X POST "$APP_URL/api/cron/expiry-reminders" \
              -H "X-Cron-Secret: $CRON_SECRET"
          )"

          cat "$response_file"
          echo
          echo "HTTP status: $http_code"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
